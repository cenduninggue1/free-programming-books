name: Validate Links

on:
  pull_request:
    branches:
      - main
    paths:
      - '**.md'
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      file_path:
        description: 'Specific file path to validate (leave empty for all files)'
        required: false
        default: ''

jobs:
  validate-links:
    name: Validate Markdown Links
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests tqdm colorama

      - name: Get changed Markdown files (PR only)
        if: github.event_name == 'pull_request'
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: '**.md'

      - name: Validate links in changed files (PR)
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          echo "Validating links in changed files..."
          python scripts/validate_links.py $CHANGED_FILES

      - name: Validate links in all files (scheduled or manual)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          FILE_PATH: ${{ github.event.inputs.file_path }}
        run: |
          if [ -n "$FILE_PATH" ]; then
            echo "Validating links in: $FILE_PATH"
            python scripts/validate_links.py "$FILE_PATH"
          else
            echo "Validating all Markdown files..."
            python scripts/validate_links.py --all
          fi

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-validation-report
          path: link-validation-report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Post PR comment on failure
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let reportContent = 'Link validation failed. Please check the workflow logs for details.';

            try {
              const report = JSON.parse(fs.readFileSync('link-validation-report.json', 'utf8'));
              const brokenLinks = report.broken_links || [];
              if (brokenLinks.length > 0) {
                const linkList = brokenLinks
                  .slice(0, 20)
                  .map(l => `- \`${l.url}\` in \`${l.file}\` (line ${l.line}): ${l.status}`)
                  .join('\n');
                reportContent = `### ❌ Broken Links Found\n\n${linkList}${
                  brokenLinks.length > 20 ? `\n\n...and ${brokenLinks.length - 20} more. See full report in workflow artifacts.` : ''
                }`;
              }
            } catch (e) {
              console.log('Could not read report file:', e.message);
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: reportContent
            });
